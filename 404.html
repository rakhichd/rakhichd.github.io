<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect all 404s to index.html for React Router to handle
      var redirectTo = window.location.protocol + "//" + window.location.host + window.location.pathname.replace(/\/404\.html$/, "/");
      window.location.replace(redirectTo);
    </script>
  </head>
  <body></body>
</html>
